<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 40 1040 1200" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- The Unova emblem (a Poké Ball with a map pin's point) in the main menu's muted Poké Ball colours. -->
  <defs>
    <clipPath id="disc">
      <circle cx="495" cy="505" r="296"/>
    </clipPath>
  </defs>
  <!-- Outline: the outer silhouette, a circle joined to the pin's point. -->
  <g fill="#101010">
    <circle cx="495" cy="505" r="340"/>
    <polygon points="751,283 1120,85 562,1195 468,840 495,505"/>
  </g>
  <!-- The light half and the pin's face. -->
  <g fill="#7c8990">
    <circle cx="495" cy="505" r="296"/>
    <polygon points="700,330 1015,193 575,1065 498,790 495,505"/>
  </g>
  <!-- The red half, above the band. -->
  <polygon clip-path="url(#disc)" fill="#c54640" points="100,0 900,0 900,220 100,660"/>
  <!-- The band and the button. -->
  <line clip-path="url(#disc)" x1="120" y1="652" x2="780" y2="287" stroke="#101010" stroke-width="24"/>
  <circle cx="495" cy="505" r="126" fill="#101010"/>
  <circle cx="495" cy="505" r="102" fill="#7c8990"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
